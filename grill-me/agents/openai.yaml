interface:
  display_name: "Grill Me"
  short_description: "逐一盘清关键分叉，复用历史结论并形成可执行决策快照"
  default_prompt: "使用 $grill-me 压力测试当前方案：先确定当前交付与设计分辨率并复用历史结论；只问仍会改变当前交付的一个 Decision，把更细或待统一设计的内容标为 pending + deferred，同时保留过程资产、意图与结果边界和写回检查点；达到 shared understanding 后知止。"
policy:
  allow_implicit_invocation: true
