interface:
  display_name: "产品架构专家"
  short_description: "复杂业务 PRD、产品架构、多端原型交互与跨应用规划"
  brand_color: "#2563EB"
  default_prompt: "Use $product-architecture-expert 基于当前需求、资料、机会清单、业务架构规划、原型、页面截图或 AI Native 产品上下文，先判断定位、商业成立、目标用户等方向事实是否已确认；未确认时止于缺口、验证与停止条件，已确认时继承事实并跑通场景链路和资源取舍；再以能力提供者视角提炼共性并保护有证据的特殊性，输出可评审的产品方案/PRD/业务架构规划；涉及 PC、手机、浏览器、APP、H5 时先建立客户端交互契约、任务/状态/恢复与多端差异，再规划需求、AC、应用、客户端与页面/状态/非页面能力的承接关系；正式正文按背景、目标、定性、概要、详细设计、流程、规则、接口抽象、风险、待确认项和验收摘要展开，详细执行控制进入执行计划；需要图形化交付时默认输出 SVG。"
policy:
  allow_implicit_invocation: true
